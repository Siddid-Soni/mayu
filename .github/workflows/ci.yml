name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MAYU_TEST_REDIS: redis://127.0.0.1:6390/0

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6390:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python:
    name: Python ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: ft, python: "3.14t" }
          - { leg: ft-stress, python: "3.14t" }
          - { leg: gil, python: "3.14" }
          - { leg: py313, python: "3.13" }
    services:
      redis:
        image: redis:8
        ports: ["6390:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python maturin pytest msgpack opentelemetry-sdk pytest-run-parallel
          VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop --uv
      - name: Diagnose THP arena detection
        if: matrix.python == '3.14t'
        run: |
          uname -a; ldd --version | head -1; cat /sys/kernel/mm/transparent_hugepage/enabled
          .venv/bin/python - <<'EOF'
          import sys
          print(sys.version)
          obj = object(); addr = id(obj)
          lines = open("/proc/self/smaps").read().splitlines()
          for i, line in enumerate(lines):
              head = line.split()[0]
              if "-" in head and not head.endswith(":"):
                  lo, hi = (int(x, 16) for x in head.split("-"))
                  if lo <= addr < hi:
                      print(f"object at {addr:#x} is in:")
                      print(repr(line), line.split())
                      print("\n".join(l for l in lines[i + 1:i + 30] if l.startswith(("VmFlags", "AnonHuge", "THP"))))
          from mayu import thp
          print("_arena_of_python_objects() ->", thp._arena_of_python_objects())
          EOF
      - name: Test
        run: |
          case "${{ matrix.leg }}" in
            ft-stress) PYTHON_GIL=0 .venv/bin/pytest tests/python -q --parallel-threads=4 ;;
            gil) MAYU_GIL_PYTHON=$PWD/.venv/bin/python .venv/bin/pytest tests/python -q ;;
            *) .venv/bin/pytest tests/python -q ;;
          esac
